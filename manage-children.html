<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Children - CAM Orphanage Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="admin-topbar">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a class="brand-heading" href="index.html">CAM Orphanage Connect</a>
      <span class="admin-badge mb-0">Admin</span>
    </div>
    <div class="container mt-3">
      <h1 class="h3">Manage Children</h1>
      <p class="text-muted mb-0">Add, edit, and remove child profiles across all orphanages.</p>
    </div>
  </header>

  <main class="container admin-page">

    <div class="admin-toolbar d-flex flex-wrap gap-3 align-items-center justify-content-between">
      <div class="d-flex flex-wrap gap-2 flex-grow-1">
        <input type="search" id="searchInput" class="form-control" style="max-width:240px" placeholder="Search children…">
        <select id="orphanageFilter" class="form-select" style="max-width:220px">
          <option value="">All orphanages</option>
        </select>
        <select id="statusFilter" class="form-select" style="max-width:180px">
          <option value="">All statuses</option>
          <option value="Sponsored">Sponsored</option>
          <option value="Needs Sponsor">Needs Sponsor</option>
        </select>
      </div>
      <button type="button" class="btn btn-admin-primary" id="addChildBtn">+ Add child</button>
    </div>

    <div class="card card-admin">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-admin align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Child</th>
                <th scope="col">Age</th>
                <th scope="col">Gender</th>
                <th scope="col">Orphanage</th>
                <th scope="col">Status</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="childrenBody"></tbody>
          </table>
        </div>
        <p id="emptyState" class="admin-empty d-none mb-0">No children match your filters.</p>
      </div>
    </div>

  </main>

  <!-- Add / Edit child modal -->
  <div class="modal fade" id="childModal" tabindex="-1" aria-labelledby="childModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="childModalLabel">Add child</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="childForm">
          <div class="modal-body">
            <input type="hidden" id="childId">
            <div class="mb-3">
              <label for="childName" class="form-label">Full name</label>
              <input type="text" class="form-control" id="childName" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label for="childAge" class="form-label">Age</label>
                <input type="number" class="form-control" id="childAge" min="0" max="21" required>
              </div>
              <div class="col-6">
                <label for="childGender" class="form-label">Gender</label>
                <select class="form-select" id="childGender" required>
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="childOrphanage" class="form-label">Orphanage</label>
              <select class="form-select" id="childOrphanage" required></select>
            </div>
            <div class="mb-3">
              <label for="childStatus" class="form-label">Status</label>
              <select class="form-select" id="childStatus" required>
                <option value="Needs Sponsor">Needs Sponsor</option>
                <option value="Sponsored">Sponsored</option>
              </select>
            </div>
            <div class="mb-1">
              <label for="childNotes" class="form-label">Notes (optional)</label>
              <textarea class="form-control" id="childNotes" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-admin-primary" id="childSubmitBtn">Add child</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/data.js"></script>
  <script src="manage-children.js"></script>
</body>
</html>
