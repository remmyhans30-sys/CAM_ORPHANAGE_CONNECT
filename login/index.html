<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign in to CAM Orphanage Connect to support verified orphanages across Cameroon.">
        <meta name="theme-color" content="#2e8b57">
        <title>Login - CAM Orphanage</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232e8b57'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
    </head>
    <body>
        <div class="photo-grid">
            <img src="images/photo1.jpg" alt="">
            <img src="images/photo2.jpg" alt="">
            <img src="images/photo3.jpg" alt="">
            <img src="images/photo4.jpg" alt="">
            <img src="images/photo5.jpg" alt="">
            <img src="images/photo6.jpg" alt="">
            <img src="images/photo7.jpg" alt="">
            <img src="images/photo8.jpg" alt="">
        </div>
        <div class="overlay"></div>
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.png" alt="CAM Orphanage" class="logo" onerror="this.style.display='none'">
                    <h1>CAM Orphanage</h1>
                    <p class="subtitle">Welcome back — sign in to continue</p>
                </div>
                <form class="login-form" novalidate>
                    <div class="auth-alert auth-alert-success is-hidden" id="loginSuccess" role="status"></div>
                    <div class="auth-alert auth-alert-error is-hidden" id="loginError" role="alert"></div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@domain.com" autocomplete="email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <div class="form-row">
                        <label class="checkbox"><input type="checkbox" id="rememberMe"> Remember me</label>
                        <a href="forgot-password.html" class="forgot">Forgot?</a>
                    </div>
                    <button type="submit" class="btn-primary">Sign in</button>
                      <div class="form-row">
                        <p class="back-link">Don't have an account? <a href="register.html">Sign up</a></p>
                    </div>
                </form>
                <p class="footer-note">Questions? <a href="#">Contact us</a></p>
            </div>
        </div>
        <script src="login.js"></script>
    </body>
</html>
