<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CAM Orphanage</title>
    <link rel="stylesheet" href="https..//fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
 <body>
       <div class="photo-grid">
            <img src="images/photo1.jpg" alt="">
            <img src="images/photo2.jpg" alt="">
            <img src="images/photo3.jpg" alt="">
            <img src="images/photo4.jpg" alt="">
            <img src="images/photo5.jpg" alt="">
            <img src="images/photo6.jpg" alt="">
            <img src="images/photo7.jpg" alt="">
            <img src="images/photo8.jpg" alt="">
        </div>
        <div class="overlay"></div>
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.png" alt="CAM Orphanage" class="logo" onerror="this.style.display='none'">
                    <h1>CAM Orphanage</h1>
                    <p class="subtitle">Forgot your password? Enter your email to reset it.</p>
                </div>
                <form class="forgot-password-form" novalidate>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn-primary">send reset link</button>
                    <p class="back-link">Remember your password? <a href="index.html">back to login</a></p>
                </form> 

            </div>
        </div>
    </body>
</html>
