<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password - CAM Orphanage Connect</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.png" alt="CAM Orphanage" class="logo" onerror="this.style.display='none'">
                    <span class="auth-badge">Password Reset</span>
                    <h1>CAM Orphanage Connect</h1>
                    <p class="subtitle">Forgot your password? Enter your email to reset.</p>
                </div>
                <form class="forgot-password-form" novalidate>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn-primary">Send reset link</button>
                    <p class="back-link">Remember your password? <a href="index.html">Back to login</a></p>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
