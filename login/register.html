<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Create an account with CAM Orphanage Connect as a donor, orphanage, or admin.">
        <meta name="theme-color" content="#2e8b57">
        <title>Register - CAM Orphanage</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232e8b57'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E">
    </head>
    <body>
        <div class="photo-grid">
            <img src="images/photo1.jpg" alt="">
            <img src="images/photo2.jpg" alt="">
            <img src="images/photo3.jpg" alt="">
            <img src="images/photo4.jpg" alt="">
            <img src="images/photo5.jpg" alt="">
            <img src="images/photo6.jpg" alt="">
            <img src="images/photo7.jpg" alt="">
            <img src="images/photo8.jpg" alt="">
        </div>
        <div class="overlay"></div>
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.png" alt="CAM Orphanage" class="logo" onerror="this.style.display='none'">
                    <h1>CAM Orphanage</h1>
                    <p class="subtitle">Create an account to get started</p>
                </div>
                <form class="register-form" novalidate>
                    <div class="auth-alert auth-alert-error is-hidden" id="registerError" role="alert"></div>
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" autocomplete="name" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" autocomplete="new-password" required>
                    </div>
                    <div class="input-group">
                        <label>I am registering as:</label>
                        <div class="role-option">
                            <label class="role-choice">
                                <input type="radio" id="admin" name="role" value="admin" required>
                                Admin
                            </label>
                            <label class="role-choice">
                                <input type="radio" id="user" name="role" value="user" required>
                                Donor
                            </label>
                            <label class="role-choice">
                                <input type="radio" id="volunteer" name="role" value="volunteer" required>
                                Orphanage
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                    <p class="back-link">Already have an account? <a href="index.html">login</a></p>
                </form>
            </div>
        </div>
        <script src="register.js"></script>
    </body>
</html>
