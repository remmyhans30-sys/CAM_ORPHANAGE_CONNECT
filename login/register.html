<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - CAM Orphanage Connect</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="brand">
                    <img src="logo.png" alt="CAM Orphanage" class="logo" onerror="this.style.display='none'">
                    <span class="auth-badge">Get Started</span>
                    <h1>CAM Orphanage Connect</h1>
                    <p class="subtitle">Create an account to get started</p>
                </div>
                <form class="register-form" novalidate>
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group password-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>
                    <div class="input-group password-field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-password" data-target="confirm-password">Show</button>
                    </div>
                    <div class="input-group">
                        <label>I am registering as:</label>
                        <div class="role-option">
                            <label class="role-choice">
                                <input type="radio" id="admin" name="role" value="admin" required>
                                Admin
                            </label>
                            <label class="role-choice">
                                <input type="radio" id="user" name="role" value="user" required>
                                Donor
                            </label>
                            <label class="role-choice">
                                <input type="radio" id="volunteer" name="role" value="volunteer" required>
                                Orphanage
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                    <p class="back-link">Already have an account? <a href="index.html">Log in</a></p>
                </form>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
