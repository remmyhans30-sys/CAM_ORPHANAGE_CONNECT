<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin sign-in for CAM Orphanage Connect.">
  <meta name="theme-color" content="#2B2250">
  <title>Admin Login - CAM Orphanage Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232B2250'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='%23FF6F59'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="admin-login-wrapper">
    <div class="card card-admin admin-login-card">
      <div class="text-center mb-4">
        <span class="admin-badge">Admin Access</span>
        <h1 class="h3 mb-1">CAM Orphanage Connect</h1>
        <p class="text-muted mb-0">Sign in to manage orphanages and needs</p>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="mb-3">
          <label for="admin-email" class="form-label">Admin email</label>
          <input type="email" class="form-control" id="admin-email" name="email" placeholder="admin@camorphanage.org" required>
        </div>
        <div class="mb-3">
          <label for="admin-password" class="form-label">Password</label>
          <input type="password" class="form-control" id="admin-password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="remember-me">
          <label class="form-check-label" for="remember-me">Remember me</label>
        </div>
        <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button type="submit" class="btn btn-admin-primary w-100">Sign in</button>
      </form>

      <p class="text-center text-muted mt-4 mb-0" style="font-size: 0.85rem;">
        Admin accounts only. Donors and orphanages sign in elsewhere.
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
