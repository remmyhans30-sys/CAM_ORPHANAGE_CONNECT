<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Needs - CAM Orphanage Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="admin-topbar">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a class="brand-heading" href="index.html">CAM Orphanage Connect</a>
      <span class="admin-badge mb-0">Admin</span>
    </div>
    <div class="container mt-3">
      <h1 class="h3">Manage Needs</h1>
      <p class="text-muted mb-0">Add, edit, and remove funding needs for each orphanage.</p>
    </div>
  </header>

  <main class="container admin-page">

    <div class="admin-toolbar d-flex flex-wrap gap-3 align-items-center justify-content-between">
      <div class="d-flex flex-wrap gap-2 flex-grow-1">
        <input type="search" id="searchInput" class="form-control" style="max-width:240px" placeholder="Search needs…">
        <select id="orphanageFilter" class="form-select" style="max-width:220px">
          <option value="">All orphanages</option>
        </select>
        <select id="statusFilter" class="form-select" style="max-width:180px">
          <option value="">All statuses</option>
          <option value="funded">Funded</option>
          <option value="in-progress">In progress</option>
          <option value="not-started">Not started</option>
        </select>
      </div>
      <button type="button" class="btn btn-admin-primary" id="addNeedBtn">+ Add need</button>
    </div>

    <div class="card card-admin">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-admin align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Need</th>
                <th scope="col">Orphanage</th>
                <th scope="col">Raised</th>
                <th scope="col">Goal</th>
                <th scope="col">Progress</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="needsBody"></tbody>
          </table>
        </div>
        <p id="emptyState" class="admin-empty d-none mb-0">No needs match your filters.</p>
      </div>
    </div>

  </main>

  <!-- Add / Edit need modal -->
  <div class="modal fade" id="needModal" tabindex="-1" aria-labelledby="needModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="needModalLabel">Add need</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="needForm">
          <div class="modal-body">
            <input type="hidden" id="needOrphanageIdOriginal">
            <input type="hidden" id="needIndex">
            <div class="mb-3">
              <label for="needOrphanage" class="form-label">Orphanage</label>
              <select class="form-select" id="needOrphanage" required></select>
            </div>
            <div class="mb-3">
              <label for="needTitle" class="form-label">Need title</label>
              <input type="text" class="form-control" id="needTitle" placeholder="e.g. New mattresses for dormitory" required>
            </div>
            <div class="row g-3 mb-1">
              <div class="col-6">
                <label for="needRaised" class="form-label">Raised (XAF)</label>
                <input type="number" class="form-control" id="needRaised" min="0" step="500" required>
              </div>
              <div class="col-6">
                <label for="needGoal" class="form-label">Goal (XAF)</label>
                <input type="number" class="form-control" id="needGoal" min="500" step="500" required>
              </div>
            </div>
            <p class="small text-muted mt-2 mb-0">Progress % is calculated automatically from raised ÷ goal.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-admin-primary" id="needSubmitBtn">Add need</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../shared/data.js"></script>
  <script src="manage-needs.js"></script>
</body>
</html>
