<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="mb-4">
      <a href="dashboard.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to dashboard</a>
      <span class="admin-badge">Activity Log</span>
      <h1 class="h3 mb-1">Activity Log</h1>
      <p class="text-muted mb-0">Every admin action across orphanages, donors, and partner organizations, in one place.</p>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by account name or action..." style="max-width: 320px;">
      <select class="form-select" id="type-filter" style="max-width: 200px;">
        <option value="all">All account types</option>
        <option value="orphanage">Orphanages</option>
        <option value="donor">Donors</option>
        <option value="partner">Partner Orgs</option>
      </select>
      <button type="button" class="btn btn-admin-outline" id="export-csv-btn">Export CSV</button>
    </div>

    <div id="empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No activity recorded yet.
    </div>

    <div class="card card-admin p-4 p-md-5">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Date/time</th>
              <th>Account</th>
              <th>Type</th>
              <th>Action</th>
              <th>By</th>
            </tr>
          </thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="activity-log.js"></script>
</body>
</html>
