<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Center - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/chat.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="dashboard.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to dashboard</a>
        <span class="admin-badge">Support Center</span>
        <h1 class="h3 mb-1">Support Center</h1>
        <p class="text-muted mb-0">Support requests and conversations from orphanages, donors, and partner organizations.</p>
      </div>
      <div class="d-flex gap-2 align-self-start">
        <a href="dashboard.html" class="btn btn-admin-outline">Dashboard</a>
        <a href="conversations.html" class="btn btn-admin-outline">Orphanage chats</a>
        <a href="visits.html" class="btn btn-admin-outline">Visit requests</a>
        <a href="reports.html" class="btn btn-admin-outline">Reports</a>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by name or message..." style="max-width: 300px;">
      <select class="form-select" id="read-filter" style="max-width: 160px;">
        <option value="all">All messages</option>
        <option value="unread">Unread only</option>
      </select>
      <select class="form-select" id="status-filter" style="max-width: 160px;">
        <option value="all">All statuses</option>
        <option value="open">Open</option>
        <option value="in-progress">In progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>
      <select class="form-select" id="priority-filter" style="max-width: 160px;">
        <option value="all">All priorities</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="normal">Normal</option>
        <option value="low">Low</option>
      </select>
    </div>

    <div id="chat-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="../shared/chat.js"></script>
  <script src="chat-adapters.js"></script>
  <script src="messages.js"></script>
</body>
</html>
