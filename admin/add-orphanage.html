<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Orphanage - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="mb-4">
          <a href="index.html" class="text-decoration-none" style="color: var(--dawn-purple);">&larr; Back to admin login</a>
        </div>

        <div class="card card-admin p-4 p-md-5">
          <span class="admin-badge">Orphanages</span>
          <h1 class="h3 mb-1">Add New Orphanage</h1>
          <p class="text-muted mb-4">Fill in the details below to register a new orphanage on the platform.</p>

          <form id="add-orphanage-form" novalidate>
            <div class="mb-3">
              <label for="orphanage-name" class="form-label">Orphanage name</label>
              <input type="text" class="form-control" id="orphanage-name" name="name" placeholder="e.g. Hope Children's Home or Foyer de l'Espérance" required>
            </div>

            <div class="mb-3">
              <label for="orphanage-location" class="form-label">Location</label>
              <input type="text" class="form-control" id="orphanage-location" name="location" placeholder="e.g. Yaoundé, Douala, Bamenda, Buea, or Limbe" required>
            </div>

            <div class="mb-3">
              <label for="orphanage-reg-number" class="form-label">Registration number</label>
              <input type="text" class="form-control" id="orphanage-reg-number" name="registrationNumber" placeholder="e.g. MINAS/2023/00456" required>
            </div>

            <div class="mb-3">
              <label for="orphanage-story" class="form-label">Story / description</label>
              <textarea class="form-control" id="orphanage-story" name="story" rows="4" placeholder="Tell donors about this orphanage..." required></textarea>
            </div>

            <div class="mb-3">
              <label for="orphanage-photo" class="form-label">Photo</label>
              <input type="file" class="form-control" id="orphanage-photo" name="photo" accept="image/*">
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label for="orphanage-children" class="form-label">Number of children</label>
                <input type="number" class="form-control" id="orphanage-children" name="childrenCount" min="0" step="1" placeholder="e.g. 24">
              </div>
              <div class="col-6 mb-3">
                <label for="orphanage-founded" class="form-label">Founding year</label>
                <input type="number" class="form-control" id="orphanage-founded" name="foundedYear" min="1900" max="2026" step="1" placeholder="e.g. 2010">
              </div>
            </div>

            <div class="mb-3">
              <label for="orphanage-capacity" class="form-label">Capacity</label>
              <input type="number" class="form-control" id="orphanage-capacity" name="capacity" min="0" step="1" placeholder="e.g. 40">
            </div>

            <div class="mb-3">
              <label for="orphanage-contact-name" class="form-label">Contact person</label>
              <input type="text" class="form-control" id="orphanage-contact-name" name="contactName" placeholder="e.g. Director's full name" required>
            </div>

            <div class="row">
              <div class="col-6 mb-3">
                <label for="orphanage-contact-phone" class="form-label">Contact phone</label>
                <input type="tel" class="form-control" id="orphanage-contact-phone" name="contactPhone" placeholder="e.g. +237 6XX XXX XXX" required>
              </div>
              <div class="col-6 mb-3">
                <label for="orphanage-contact-email" class="form-label">Contact email</label>
                <input type="email" class="form-control" id="orphanage-contact-email" name="contactEmail" placeholder="e.g. contact@orphanage.org">
              </div>
            </div>

            <div class="mb-4">
              <label for="orphanage-documents" class="form-label">Verification documents</label>
              <input type="file" class="form-control" id="orphanage-documents" name="documents" accept=".pdf,.jpg,.jpeg,.png" multiple required>
              <div class="form-text">Registration certificate, government ID, or other proof of legitimacy. Required before an orphanage can be verified.</div>
            </div>

            <div class="mb-4">
              <label for="orphanage-status" class="form-label">Verification status</label>
              <select class="form-select" id="orphanage-status" name="status" required>
                <option value="pending" selected>Pending</option>
                <option value="verified">Verified</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>

            <div id="add-orphanage-success" class="alert alert-success py-2 d-none" role="alert">
              Orphanage saved successfully.
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-admin-primary">Save orphanage</button>
              <button type="reset" class="btn btn-outline-secondary" style="border-radius: 100px;">Clear</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="add-orphanage.js"></script>
</body>
</html>
