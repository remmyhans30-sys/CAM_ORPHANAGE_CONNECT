<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Queue - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="mb-4">
      <a href="orphanages.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to orphanages</a>
      <span class="admin-badge">Verification</span>
      <h1 class="h3 mb-1">Verification Queue</h1>
      <p class="text-muted mb-0">Review orphanages and move them between statuses.</p>
    </div>

    <div id="empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No orphanages yet. <a href="add-orphanage.html">Add the first one</a>.
    </div>

    <div class="row g-4" id="queue-columns">
      <div class="col-md-4">
        <h2 class="h6 text-uppercase text-muted mb-3">Pending</h2>
        <div class="d-flex flex-column gap-3" id="col-pending"></div>
      </div>
      <div class="col-md-4">
        <h2 class="h6 text-uppercase text-muted mb-3">Verified</h2>
        <div class="d-flex flex-column gap-3" id="col-verified"></div>
      </div>
      <div class="col-md-4">
        <h2 class="h6 text-uppercase text-muted mb-3">Rejected</h2>
        <div class="d-flex flex-column gap-3" id="col-rejected"></div>
      </div>
    </div>
  </div>

  <script src="verification-queue.js"></script>
</body>
</html>
