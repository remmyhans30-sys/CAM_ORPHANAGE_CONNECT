<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C18 63 6 35 26 16 39 4 50 16 50 33 50 16 61 4 74 16 94 35 82 63 50 88Z' fill='%2312804A'/%3E%3Ccircle cx='50' cy='9' r='6' fill='%23E9B93A'/%3E%3C/svg%3E">
  <title>Partner Organizations - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="index.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to admin login</a>
        <span class="admin-badge">Partner Organizations</span>
        <h1 class="h3 mb-1">Partner Organizations</h1>
        <p class="text-muted mb-0">Companies, NGOs, and diaspora associations that sponsor orphanages or refer placement cases.</p>
      </div>
      <div class="d-flex gap-2 align-self-start">
        <a href="dashboard.html" class="btn btn-admin-outline">Dashboard</a>
        <a href="reports.html" class="btn btn-admin-outline">Reports</a>
        <a href="messages.html" class="btn btn-admin-outline">Inbox</a>
        <button type="button" class="btn btn-admin-primary" id="export-csv-btn">Export CSV</button>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search partner organizations..." style="max-width: 280px;">
      <select class="form-select" id="status-filter" style="max-width: 220px;">
        <option value="all">All (excluding rejected)</option>
        <option value="verified">Verified</option>
        <option value="pending">Pending</option>
        <option value="needs-info">Needs info</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <div id="empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No partner organizations have submitted their profile yet.
    </div>

    <div id="filter-empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No partner organizations match this filter.
    </div>

    <div class="row g-4" id="partners-grid"></div>
  </div>

  <script src="api.js"></script>
  <script src="partners.js"></script>
</body>
</html>
