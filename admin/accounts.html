<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Accounts - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="index.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to admin login</a>
        <span class="admin-badge">All Accounts</span>
        <h1 class="h3 mb-1">All Accounts</h1>
        <p class="text-muted mb-0">Orphanages, donors, and partner organizations in one place.</p>
      </div>
      <div class="d-flex gap-2 align-self-start">
        <a href="dashboard.html" class="btn btn-admin-outline">Dashboard</a>
        <a href="reports.html" class="btn btn-admin-outline">Reports</a>
        <a href="messages.html" class="btn btn-admin-outline">Inbox</a>
      </div>
    </div>

    <div class="d-flex gap-2 flex-wrap mb-4" id="account-tabs">
      <button type="button" class="filter-tab active" data-tab="orphanages">Orphanages <span class="tab-count" id="count-orphanages">0</span></button>
      <button type="button" class="filter-tab" data-tab="donors">Donors <span class="tab-count" id="count-donors">0</span></button>
      <button type="button" class="filter-tab" data-tab="partners">Partner Orgs <span class="tab-count" id="count-partners">0</span></button>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by name..." style="max-width: 320px;">
      <select class="form-select" id="status-filter" style="max-width: 220px;">
        <option value="all">All statuses</option>
        <option value="verified">Verified</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
        <option value="flagged">Flagged</option>
        <option value="active">Active</option>
      </select>
    </div>

    <div id="empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No results found.
    </div>

    <div class="d-flex flex-column gap-3" id="accounts-list"></div>
  </div>

  <script src="accounts.js"></script>
</body>
</html>
