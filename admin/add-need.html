<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Need - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="mb-4">
          <a href="index.html" class="text-decoration-none" style="color: var(--dawn-purple);">&larr; Back to admin login</a>
        </div>

        <div class="card card-admin p-4 p-md-5">
          <span class="admin-badge">Needs</span>
          <h1 class="h3 mb-1">Add a Need</h1>
          <p class="text-muted mb-4">Create a fundraising need and link it to an orphanage.</p>

          <form id="add-need-form" novalidate>
            <div class="mb-3">
              <label for="need-title" class="form-label">Need title</label>
              <input type="text" class="form-control" id="need-title" name="title" placeholder="e.g. New dormitory beds" required>
            </div>

            <div class="mb-3">
              <label for="need-goal" class="form-label">Goal amount (FCFA)</label>
              <input type="number" class="form-control" id="need-goal" name="goal" min="1" step="1" placeholder="e.g. 500000" required>
            </div>

            <div class="mb-4">
              <label for="need-orphanage" class="form-label">Orphanage</label>
              <select class="form-select" id="need-orphanage" name="orphanage" required>
                <option value="" disabled selected>Select an orphanage&hellip;</option>
              </select>
              <div id="no-orphanages-hint" class="form-text d-none">
                No orphanages have registered yet.
              </div>
            </div>

            <div id="add-need-success" class="alert alert-success py-2 d-none" role="alert">
              Need saved successfully.
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-admin-primary">Save need</button>
              <button type="reset" class="btn btn-outline-secondary" style="border-radius: 100px;">Clear</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="add-need.js"></script>
</body>
</html>
