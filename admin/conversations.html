<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Monitor - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/chat.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="dashboard.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to dashboard</a>
        <span class="admin-badge">Chat Monitor</span>
        <h1 class="h3 mb-1">Orphanage chats</h1>
        <p class="text-muted mb-0">Direct conversations between orphanages and the donors and partners they work with. You can read every chat and step in as the CAM Orphanage Connect team. To message one person privately, use the <a href="messages.html">Support Center</a>.</p>
      </div>
      <div class="d-flex gap-2 align-self-start">
        <a href="dashboard.html" class="btn btn-admin-outline">Dashboard</a>
        <a href="messages.html" class="btn btn-admin-outline">Support Center</a>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <input type="text" class="form-control" id="search-input" placeholder="Search by name or message..." style="max-width: 280px;">
      <select class="form-select" id="kind-filter" style="max-width: 220px;">
        <option value="all">All chats</option>
        <option value="do">Donor and orphanage</option>
        <option value="po">Partner and orphanage</option>
      </select>
    </div>

    <div id="load-error" class="alert alert-danger d-none" role="alert"></div>

    <div id="chat-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="../shared/chat.js"></script>
  <script src="chat-adapters.js"></script>
  <script src="conversations.js"></script>
</body>
</html>
