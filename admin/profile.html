<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C18 63 6 35 26 16 39 4 50 16 50 33 50 16 61 4 74 16 94 35 82 63 50 88Z' fill='%2312804A'/%3E%3Ccircle cx='50' cy='9' r='6' fill='%23E9B93A'/%3E%3C/svg%3E">
  <title>My Profile - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <a href="dashboard.html" class="text-decoration-none d-block mb-4" style="color: var(--dawn-purple);">&larr; Back to dashboard</a>

        <div class="card card-admin p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="avatar" id="profile-avatar" style="width:72px;height:72px;font-size:1.3rem; margin: 0 auto 0.75rem;">A</span>
            <h1 class="h4 mb-1" id="profile-email">admin@example.com</h1>
            <span class="tier-tag tier-friend" id="profile-role">Super Admin</span>
          </div>

          <form id="profile-form">
            <div class="mb-3">
              <label class="form-label" for="profile-name">Display name</label>
              <input type="text" class="form-control" id="profile-name" placeholder="How your name should appear in this admin panel">
            </div>
            <div class="d-flex align-items-center gap-2">
              <button type="submit" class="btn btn-admin-primary">Save name</button>
              <span class="small text-muted" id="profile-save-status"></span>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="profile.js"></script>
</body>
</html>
