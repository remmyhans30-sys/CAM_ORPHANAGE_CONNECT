<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orphanages - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="index.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to admin login</a>
        <span class="admin-badge">Orphanages</span>
        <h1 class="h3 mb-1">All Orphanages</h1>
        <p class="text-muted mb-0">Manage the orphanages registered on the platform.</p>
      </div>
      <a href="add-orphanage.html" class="btn btn-admin-primary align-self-start">+ Add orphanage</a>
    </div>

    <div class="card card-admin p-3 p-md-4">
      <div id="empty-state" class="text-center text-muted py-5 d-none">
        No orphanages yet. <a href="add-orphanage.html">Add the first one</a>.
      </div>

      <div class="table-responsive">
        <table class="table align-middle mb-0" id="orphanages-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Location</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="orphanages-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="orphanages.js"></script>
</body>
</html>
