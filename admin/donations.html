<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donations - CAM Orphanage Connect Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
      <div>
        <a href="dashboard.html" class="text-decoration-none d-block mb-2" style="color: var(--dawn-purple);">&larr; Back to dashboard</a>
        <span class="admin-badge">Donations</span>
        <h1 class="h3 mb-1">Donations</h1>
        <p class="text-muted mb-0">Every individual donation across all donors.</p>
      </div>
      <button type="button" class="btn btn-admin-outline align-self-start" id="export-csv-btn">Export CSV</button>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by donor name..." style="max-width: 280px;">
      <select class="form-select" id="status-filter" style="max-width: 180px;">
        <option value="all">All statuses</option>
        <option value="completed">Completed</option>
        <option value="refunded">Refunded</option>
      </select>
    </div>

    <div id="empty-state" class="card card-admin p-5 text-center text-muted d-none">
      No donations recorded yet.
    </div>

    <div id="table-card" class="card card-admin p-4 p-md-5">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Donor</th>
              <th style="cursor:pointer;" id="sort-amount">Amount &#8597;</th>
              <th>Need</th>
              <th>Method</th>
              <th style="cursor:pointer;" id="sort-date">Date &#8597;</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="donations-tbody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="small text-muted" id="pagination-info"></span>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-admin-outline btn-sm" id="prev-page-btn">&larr; Prev</button>
          <button type="button" class="btn btn-admin-outline btn-sm" id="next-page-btn">Next &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="donation-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius: 20px; border: none;">
        <div class="modal-header">
          <h2 class="h5 mb-0">Donation Details</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="donation-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="donations.js"></script>
</body>
</html>
