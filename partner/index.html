<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login - CAM Orphanage Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="admin-login-wrapper">
    <div class="card card-admin admin-login-card">
      <div class="text-center mb-4">
        <span class="admin-badge">Partner Portal</span>
        <h1 class="h3 mb-1">CAM Orphanage Connect</h1>
        <p class="text-muted mb-0">Sign in to manage your partner organization account</p>
      </div>

      <form id="partner-login-form" novalidate>
        <div class="mb-3">
          <label for="partner-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="partner-email" name="email" placeholder="you@organization.org" required>
        </div>
        <div class="mb-3">
          <label for="partner-password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="partner-password" name="password" placeholder="Enter your password" required>
            <button type="button" class="btn btn-outline-secondary" id="toggle-password-btn" style="border-radius: 0 100px 100px 0;">Show</button>
          </div>
        </div>
        <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button type="submit" class="btn btn-admin-primary w-100">Sign in</button>
      </form>

      <p class="text-center text-muted mt-4 mb-0" style="font-size: 0.85rem;">
        Don't have login access yet? Contact the CAM Orphanage Connect admin team &mdash; they set up your partner account and password.
      </p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
