<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Orphanages - CAM Orphanage Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="text-center py-2">
    <span class="dashboard-title-pill">PARTNER PORTAL</span>
  </div>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <div class="dashboard-brand">
        <span class="dashboard-brand-icon">&#10084;</span>
        <span>CAM Orphanage<br>Connect</span>
      </div>
      <nav class="dashboard-nav">
        <a href="dashboard.html" class="dashboard-nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="orphanages.html" class="dashboard-nav-link active"><i class="bi bi-house-heart"></i> Browse Orphanages</a>
        <a href="messages.html" id="messages-nav-link" class="dashboard-nav-link"><i class="bi bi-chat-dots"></i> Messages</a>
        <a href="index.html" class="dashboard-nav-link logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </nav>
    </aside>

    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <button type="button" class="btn btn-sm btn-admin-outline d-lg-none" id="sidebar-toggle-btn"><i class="bi bi-list"></i></button>
        <h1 class="h5 mb-0">Browse Orphanages</h1>
      </div>

      <div class="p-4 p-md-5">
        <div class="mb-4">
          <p class="text-muted mb-0">View verified orphanages on the platform and their current needs.</p>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-4">
          <input type="search" class="form-control" id="search-input" style="max-width: 320px;" placeholder="Search by name or location...">
          <select class="form-select" id="location-filter" style="max-width: 200px;">
            <option value="">All locations</option>
          </select>
          <select class="form-select" id="sort-select" style="max-width: 220px;">
            <option value="name-asc">Name (A-Z)</option>
            <option value="children-desc">Most children</option>
            <option value="needs-desc">Most active needs</option>
            <option value="raised-desc">Most raised</option>
          </select>
        </div>

        <div class="row g-4" id="orphanages-grid"></div>
        <p class="text-muted small mt-3 d-none" id="empty-state">No orphanages match your search.</p>
      </div>

      <p class="text-center text-muted small py-3 mb-0">&copy; 2026 CAM Orphanage Connect. All Rights Reserved.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="orphanages.js"></script>
</body>
</html>
